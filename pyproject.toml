[project]
name = "ellphi-alpha"
version = "0.1.0"
description = "Anisotropic alpha complex for ellipsoid-based topological data analysis"
authors = [
  { name = "Tomoki Uda", email = "tomoki.uda@gmail.com" }
]
homepage = "https://github.com/uda/ellphi-alpha"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
]
keywords = [
  "topological data analysis",
  "alpha complex",
  "anisotropic",
  "ellipsoid",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "ellphi>=0.1",
]

[tool.poetry]
packages = [{ include = "ellphi_alpha", from = "src" }]
package-mode = true

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^7.0.0"
black = { version = "^25.1.0", extras = ["jupyter"] }
mypy = "^1.8"

[tool.poetry.group.demo]
optional = true

[tool.poetry.group.demo.dependencies]
jupyterlab = ">=4.1"
ipykernel = ">=6.28"
gudhi = ">=3.9"
matplotlib = ">=3.9"
pandas = "^2.2.0"
tqdm = "^4.67.1"

[tool.mypy]
mypy_path = "src"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
