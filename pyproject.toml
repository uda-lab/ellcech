[project]
name = "ellphi-alpha"
version = "0.1.0"
description = "Anisotropic alpha complex for ellipsoid-based topological data analysis"
authors = [
  { name = "Tomoki Uda", email = "tomoki.uda@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
keywords = [
  "topological data analysis",
  "alpha complex",
  "anisotropic",
  "ellipsoid",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "ellphi>=0.1",
]

[project.optional-dependencies]
demo = [
  "jupyterlab>=4.1",
  "ipykernel>=6.28",
  "gudhi>=3.9",
  "matplotlib>=3.9",
  "pandas>=2.2.0,<3.0.0",
  "tqdm>=4.67.1,<5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "black[jupyter]>=25.1.0,<26.0.0",
  "mypy>=1.8,<2.0",
]

[project.urls]
Homepage = "https://github.com/uda-lab/ellcech"

[tool.mypy]
mypy_path = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ellphi_alpha"]
